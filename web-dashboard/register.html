<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sign Up - Smart Trolley Billing System</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Auth Scripts -->
    <script src="auth.js"></script>
</head>
<body class="dark-theme login-body">
    <div class="login-bg-glow">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
        <div class="glow-sphere sphere-3"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card glass-panel gradient-border" style="max-width: 480px;">
            <div class="login-header">
                <div class="logo-icon-lg" style="background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2)); border-color: rgba(6, 182, 212, 0.4); color: var(--accent-cyan);">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="login-title">Create Account</h1>
                <p class="login-subtitle">Sign up for instant smart trolley shopping & digital receipts</p>
            </div>

            <div id="register-error-alert" class="login-alert hidden">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="register-error-msg">Registration error</span>
            </div>

            <div id="register-success-alert" class="login-alert hidden" style="background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: #34d399;">
                <i class="fa-solid fa-circle-check"></i>
                <span id="register-success-msg">Account created! Redirecting...</span>
            </div>

            <form id="register-form" class="login-form" action="javascript:void(0)" method="POST">
                <div class="form-group">
                    <label for="reg-name"><i class="fa-solid fa-user"></i> Full Name</label>
                    <div class="input-with-icon">
                        <input type="text" id="reg-name" name="name" placeholder="e.g. John Doe" required autocomplete="name" autofocus>
                        <i class="fa-solid fa-address-card input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-username"><i class="fa-solid fa-id-badge"></i> Username</label>
                    <div class="input-with-icon">
                        <input type="text" id="reg-username" name="username" placeholder="Choose a unique username" required autocomplete="username">
                        <i class="fa-solid fa-at input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                    <div class="input-with-icon">
                        <input type="email" id="reg-email" name="email" placeholder="e.g. admin@gmail.com" autocomplete="email">
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-phone"><i class="fa-solid fa-phone"></i> Mobile Phone Number (for SMS OTP)</label>
                    <div class="input-with-icon">
                        <input type="tel" id="reg-phone" name="phone" placeholder="e.g. 9876543210" autocomplete="tel">
                        <i class="fa-solid fa-mobile-screen input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password"><i class="fa-solid fa-lock"></i> Password (min 6 characters)</label>
                    <div class="input-with-icon">
                        <input type="password" id="reg-password" name="password" placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
                        <button type="button" id="toggle-reg-pass" class="password-toggle-btn" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye" id="toggle-reg-pass-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password"><i class="fa-solid fa-shield-halved"></i> Confirm Password</label>
                    <div class="input-with-icon">
                        <input type="password" id="reg-confirm-password" name="confirmPassword" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
                        <button type="button" id="toggle-reg-confirm" class="password-toggle-btn" aria-label="Toggle confirm password visibility">
                            <i class="fa-solid fa-eye" id="toggle-reg-confirm-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 10px;">
                    <button type="submit" id="reg-submit-btn" class="btn btn-primary login-btn">
                        <span>Register & Get Started</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>

            <div class="login-footer" style="margin-top: 24px; border-top: 1px solid var(--border-subtle); padding-top: 16px; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.85rem; color: var(--text-muted);">Already have an account?</span>
                <a href="login.html" class="guest-link" style="font-weight: 600; color: var(--accent-cyan); display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </a>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
