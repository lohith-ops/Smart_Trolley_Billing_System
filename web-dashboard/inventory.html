<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trolley - Inventory</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .inventory-list {
            display: grid;
            gap: 16px;
        }

        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            transition: var(--transition);
        }

        .inventory-item:hover {
            border-color: var(--accent-purple);
            transform: scale(1.01);
        }

        .item-identity {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 2;
        }

        .tag-icon {
            color: var(--text-secondary);
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-info h4 { font-size: 1.1rem; }
        .item-info span { font-size: 0.8rem; color: var(--text-secondary); font-family: monospace; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px;}

        .item-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-green);
            flex: 1;
            text-align: right;
        }

        .item-actions {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-icon:hover {
            background: var(--accent-cyan);
            color: white;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar Navigation (Same as Dashboard) -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <h2>Smart Trolley</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
                <a href="inventory.html" class="nav-item active">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span>Inventory</span>
                </a>
                <a href="transactions.html" class="nav-item">
                    <i class="fa-solid fa-receipt"></i>
                    <span>Transactions</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Analytics</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="pulse-dot"></span>
                    <span>System Online</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <div class="header-search">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Search inventory...">
                </div>
                <div class="header-actions">
                    <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=10b981&color=fff" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Stock Level Heat Map -->
            <div class="glass-panel" style="padding: 24px;">
                <h3 style="font-weight:600; font-size:1.1rem; margin-bottom:12px;">
                    <i class="fa-solid fa-fire-flame-curved" style="margin-right: 8px; color: var(--accent-red);"></i>Stock Level Heat Map
                </h3>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px;">
                    Visual warehouse levels of active products on shelving locations. Low stock cells blink red.
                </p>
                <div class="heatmap-container" id="stock-heatmap">
                    <!-- Populated dynamically by inventory.js -->
                </div>
            </div>

            <div class="glass-panel" style="padding: 24px; flex: 1;">
                <div class="panel-header" style="margin-bottom: 24px;">
                    <h3>Product Inventory</h3>
                    <button class="btn btn-outline" id="add-product-btn"><i class="fa-solid fa-plus"></i> Add Product</button>
                </div>
                
                <div class="inventory-list" id="inventory-list">
                    <!-- Populated by inventory.js -->
                </div>
            </div>
        </main>
    </div>

    <!-- Product Form Modal (Add / Edit) -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-box glass-panel" style="max-height: 90vh; overflow-y: auto;">
            <div class="modal-icon" style="color: var(--accent-cyan);">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <h2 id="modal-title">Add Product</h2>
            <p class="modal-sub">Create or update catalog items</p>
            
            <form id="product-form" class="register-form">
                <input type="hidden" id="prod-original-uid"> <!-- key for edit mode if UID changes -->
                <div class="form-group">
                    <label>Card UID</label>
                    <input type="text" id="prod-uid" required placeholder="e.g. 5C 1E 7E 05" class="form-input">
                </div>
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prod-name" required placeholder="e.g. Milk 1L" class="form-input">
                </div>
                <div class="form-group">
                    <label>Price (Rs.)</label>
                    <input type="number" step="0.01" id="prod-price" required placeholder="0.00" class="form-input">
                </div>
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" id="prod-stock" required placeholder="20" class="form-input">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="prod-category" required class="form-input">
                        <option value="Dairy">Dairy</option>
                        <option value="Grains">Grains</option>
                        <option value="Bakery">Bakery</option>
                        <option value="Produce">Produce</option>
                        <option value="Grocery">Grocery</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Shelf Location</label>
                    <input type="text" id="prod-shelf" required placeholder="e.g. Aisle A - Shelf 1" class="form-input">
                </div>
                <div class="form-group">
                    <label>Ongoing Offer</label>
                    <input type="text" id="prod-offer" placeholder="e.g. 10% Off (Optional)" class="form-input">
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="prod-cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-checkout" id="prod-submit-btn">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="shared.js"></script>
    <script src="inventory.js"></script>
</body>
</html>
