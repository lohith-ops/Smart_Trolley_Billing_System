<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trolley - Employee Management</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Auth Guard -->
    <script src="auth.js"></script>
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <div style="font-weight: 600; font-size: 1.1rem; color: var(--text-primary);">
                    Employee Roster Management
                </div>
                <div class="header-actions">
                    <button class="btn btn-outline" id="add-employee-btn">
                        <i class="fa-solid fa-user-plus"></i> Add Employee
                    </button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=10b981&color=fff" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Employee Grid -->
            <div class="employees-grid" id="employees-container">
                <!-- Dynamic cards populated by employees.js -->
            </div>
        </main>
    </div>

    <!-- Employee Roster Modal -->
    <div class="modal-overlay" id="employee-modal">
        <div class="modal-box glass-panel">
            <div class="modal-icon" style="color: var(--accent-purple);">
                <i class="fa-solid fa-users"></i>
            </div>
            <h2 id="emp-modal-title">Register Employee</h2>
            <p class="modal-sub">Create or modify worker accounts and shifts</p>
            
            <form id="employee-form" class="register-form">
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" id="emp-id" required placeholder="e.g. E005" class="form-input">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="emp-name" required placeholder="e.g. Lohith Kumar" class="form-input">
                </div>
                <div class="form-group">
                    <label>Username / Login ID</label>
                    <input type="text" id="emp-username" placeholder="e.g. lohi or cashier1" class="form-input" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Assigned Role</label>
                    <select id="emp-role" required class="form-input">
                        <option value="Admin">Admin</option>
                        <option value="Manager">Manager</option>
                        <option value="Cashier">Cashier</option>
                        <option value="Inventory Staff">Inventory Staff</option>
                    </select>
                </div>
                <div class="form-group" id="emp-password-group">
                    <label>Assign Login Password</label>
                    <input type="password" id="emp-password" placeholder="e.g. staff123 (min 6 characters)" class="form-input" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Working Shift</label>
                    <select id="emp-shift" required class="form-input">
                        <option value="Morning (08:00 AM - 04:00 PM)">Morning (08:00 AM - 04:00 PM)</option>
                        <option value="Evening (04:00 PM - 12:00 AM)">Evening (04:00 PM - 12:00 AM)</option>
                        <option value="Night (12:00 AM - 08:00 AM)">Night (12:00 AM - 08:00 AM)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Roster Status</label>
                    <select id="emp-status" required class="form-input">
                        <option value="Active">Active</option>
                        <option value="On Leave">On Leave</option>
                        <option value="Suspended">Suspended</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="emp-cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-checkout" id="emp-submit-btn" style="background:var(--grad-primary);">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div class="modal-overlay" id="reset-password-modal">
        <div class="modal-box glass-panel" style="max-width: 440px;">
            <div class="modal-icon" style="color: var(--accent-cyan);">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2>Reset Password</h2>
            <p class="modal-sub" id="reset-modal-sub">Assign a new login password for this employee</p>
            
            <form id="reset-password-form" class="register-form" style="margin-top: 15px;">
                <input type="hidden" id="reset-emp-id">
                <div class="form-group">
                    <label>Employee Name</label>
                    <input type="text" id="reset-emp-name" readonly class="form-input readonly-input">
                </div>
                <div class="form-group">
                    <label>New Password (min 6 characters)</label>
                    <div style="position: relative;">
                        <input type="password" id="reset-new-password" required minlength="6" placeholder="Enter new secure password" class="form-input" style="padding-right: 40px;">
                        <button type="button" id="toggle-reset-pass" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer;">
                            <i class="fa-solid fa-eye" id="toggle-reset-icon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-actions" style="margin-top: 20px;">
                    <button type="button" class="btn btn-outline" id="reset-cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="reset-submit-btn" style="background: var(--accent-cyan); color: #000; font-weight: 600;">
                        <i class="fa-solid fa-check"></i> Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="shared.js"></script>
    <script src="employees.js"></script>
</body>
</html>
