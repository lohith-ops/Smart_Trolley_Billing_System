<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trolley - Multi-Trolley Fleet Monitor</title>
    <meta name="description" content="Real-time fleet monitor for all active Smart Trolleys. View battery, Wi-Fi signal, cart value and device health.">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Auth Guard -->
    <script src="auth.js"></script>
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar (populated dynamically by shared.js) -->
        <aside class="sidebar glass-panel"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <div style="font-weight:600;font-size:1.1rem;color:var(--text-primary);">
                    <i class="fa-solid fa-cart-shopping" style="margin-right:10px;color:var(--accent-cyan);"></i>
                    Multi-Trolley Fleet Monitor
                </div>
                <div class="header-actions">
                    <button class="btn btn-outline" id="add-trolley-btn" style="color: var(--accent-cyan); border-color: rgba(6, 182, 212, 0.4); padding: 6px 14px; font-size: 0.85rem;">
                        <i class="fa-solid fa-plus"></i> Add Trolley
                    </button>
                    <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=10b981&color=fff" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Fleet Summary Stats Bar -->
            <div class="glass-panel" style="padding:16px 24px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;margin-bottom:4px;">
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:38px;height:38px;border-radius:10px;background:rgba(16,185,129,0.15);display:flex;align-items:center;justify-content:center;">
                        <i class="fa-solid fa-circle-check" style="color:var(--accent-green);font-size:1rem;"></i>
                    </div>
                    <div>
                        <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:2px;">Online Trolleys</div>
                        <div style="font-size:1.4rem;font-weight:700;color:var(--accent-green);" id="stat-online-count">—</div>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:38px;height:38px;border-radius:10px;background:rgba(99,102,241,0.15);display:flex;align-items:center;justify-content:center;">
                        <i class="fa-solid fa-cart-shopping" style="color:var(--accent-purple);font-size:1rem;"></i>
                    </div>
                    <div>
                        <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:2px;">Total Trolleys</div>
                        <div style="font-size:1.4rem;font-weight:700;color:var(--accent-purple);" id="stat-total-count">—</div>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:38px;height:38px;border-radius:10px;background:rgba(251,191,36,0.15);display:flex;align-items:center;justify-content:center;">
                        <i class="fa-solid fa-battery-half" style="color:#f59e0b;font-size:1rem;"></i>
                    </div>
                    <div>
                        <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:2px;">Avg. Battery</div>
                        <div style="font-size:1.4rem;font-weight:700;color:#f59e0b;" id="stat-avg-battery">—</div>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:38px;height:38px;border-radius:10px;background:rgba(6,182,212,0.15);display:flex;align-items:center;justify-content:center;">
                        <i class="fa-solid fa-basket-shopping" style="color:var(--accent-cyan);font-size:1rem;"></i>
                    </div>
                    <div>
                        <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:2px;">Trolleys with Items</div>
                        <div style="font-size:1.4rem;font-weight:700;color:var(--accent-cyan);" id="stat-active-count">—</div>
                    </div>
                </div>
            </div>

            <!-- Filters & Search Toolbar -->
            <div class="glass-panel" style="padding:16px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;">
                <div style="display:flex;gap:10px;" id="filter-container">
                    <button class="btn btn-outline active-filter" data-filter="all" style="padding:6px 12px;font-size:0.85rem;">All Trolleys</button>
                    <button class="btn btn-outline" data-filter="online"  style="padding:6px 12px;font-size:0.85rem;">Online</button>
                    <button class="btn btn-outline" data-filter="offline" style="padding:6px 12px;font-size:0.85rem;">Offline</button>
                </div>
                <div class="header-search" style="margin:0;width:280px;">
                    <i class="fa-solid fa-search search-icon"></i>
                    <input type="text" id="trolley-search" placeholder="Search by trolley ID or name...">
                </div>
            </div>

            <!-- Trolleys Grid -->
            <div class="trolleys-grid" id="trolleys-container">
                <!-- Cards injected dynamically by trolleys.js -->
            </div>
        </main>
    </div>

    <!-- Add / Register Trolley Modal -->
    <div class="modal-overlay" id="trolley-modal">
        <div class="modal-box glass-panel" style="max-width: 460px;">
            <div class="modal-icon" style="color: var(--accent-cyan);">
                <i class="fa-solid fa-cart-plus"></i>
            </div>
            <h2>Register Smart Trolley</h2>
            <p class="modal-sub">Add a new IoT shopping trolley to the supermarket fleet</p>
            
            <form id="trolley-form" class="register-form" style="margin-top: 15px;">
                <div class="form-group">
                    <label>Trolley ID</label>
                    <input type="text" id="modal-trolley-id" required placeholder="e.g. TROLLEY-004" class="form-input" style="text-transform: uppercase;">
                </div>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="modal-trolley-name" placeholder="e.g. Smart Trolley 004" class="form-input">
                </div>
                <div class="form-group">
                    <label>Assigned Store Section</label>
                    <select id="modal-trolley-section" class="form-input">
                        <option value="Ground Floor - Main Entrance">Ground Floor - Main Entrance</option>
                        <option value="Aisle A - Grocery & Grains">Aisle A - Grocery & Grains</option>
                        <option value="Aisle B - Bakery & Snacks">Aisle B - Bakery & Snacks</option>
                        <option value="Aisle C - Dairy & Beverages">Aisle C - Dairy & Beverages</option>
                        <option value="First Floor - Electronics & Home">First Floor - Electronics & Home</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Firmware Version</label>
                    <input type="text" id="modal-trolley-fw" value="2.0" class="form-input">
                </div>
                
                <div class="form-actions" style="margin-top: 20px;">
                    <button type="button" class="btn btn-outline" id="modal-trolley-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="modal-trolley-submit" style="background: var(--grad-primary);">
                        <i class="fa-solid fa-check"></i> Save Trolley
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="shared.js"></script>
    <script src="trolleys.js"></script>
</body>
</html>
