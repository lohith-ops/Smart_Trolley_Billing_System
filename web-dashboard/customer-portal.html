<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trolley - Customer Member Portal</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Auth Guard -->
    <script src="auth.js"></script>
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <div style="font-weight: 600; font-size: 1.1rem; color: var(--text-primary);" id="portal-header-title">
                    Shopper Member Hub
                </div>
                <div class="header-actions" id="portal-header-actions">
                    <a href="login.html" class="btn btn-outline" id="portal-login-nav-btn" style="display: none; padding: 6px 12px; font-size: 0.85rem; text-decoration: none;">
                        <i class="fa-solid fa-right-to-bracket"></i> Sign In / Register
                    </a>
                    <button class="btn btn-outline" id="portal-logout-btn" style="display: none; padding: 6px 12px; font-size: 0.85rem;">
                        <i class="fa-solid fa-sign-out-alt"></i> Logout
                    </button>
                    <div class="user-profile" id="portal-user-profile" style="display: flex;">
                        <img id="portal-avatar-img" src="https://ui-avatars.com/api/?name=User&background=06b6d4&color=fff" alt="User">
                        <span id="portal-header-username">Guest Shopper</span>
                    </div>
                </div>
            </header>

            <!-- Customer Portal Dashboard -->
            <div id="portal-dashboard-container" class="portal-grid" style="display: grid;">
                <!-- Left: Profile Summary -->
                <div class="glass-panel profile-sidebar">
                    <img src="https://ui-avatars.com/api/?name=Lohith+Kumar&background=06b6d4&color=fff" alt="Lohith Kumar">
                    <h3 style="margin-top: 8px;" id="portal-name">Lohith Kumar</h3>
                    <span class="trolley-status-badge active" style="font-size: 0.8rem; padding: 4px 10px;" id="portal-tier">Gold Member</span>
                    
                    <div class="points-badge" id="portal-points">
                        <i class="fa-solid fa-award"></i> 230 Points
                    </div>
                    
                    <div style="text-align: left; width: 100%; font-size: 0.85rem; color: var(--text-secondary); display: flex; flex-direction: column; gap: 8px; margin-top: 16px; border-top: 1px solid var(--panel-border); padding-top: 16px;">
                        <span><strong style="color: var(--text-primary);">Email:</strong> <span id="portal-email">lohith.k@gmail.com</span></span>
                        <span><strong style="color: var(--text-primary);">Phone:</strong> <span id="portal-phone">+91 98765 43210</span></span>
                    </div>

                    <a href="feedback.html" class="btn btn-outline" style="margin-top: 16px; width: 100%; text-align: center; text-decoration: none; font-size: 0.85rem; color: #f59e0b; border-color: rgba(245, 158, 11, 0.4);">
                        <i class="fa-solid fa-star" style="margin-right: 6px;"></i> Rate Shopping Experience
                    </a>
                </div>

                <!-- Right: Active Cart and History -->
                <div style="display: flex; flex-direction: column; gap: 24px;">
                    <!-- Saved Wishlist -->
                    <div class="glass-panel" style="padding: 24px;">
                        <h3 style="font-weight:600; font-size:1.1rem; margin-bottom:16px;">
                            <i class="fa-solid fa-heart" style="margin-right: 8px; color: var(--accent-red);"></i>My Wishlist Products
                        </h3>
                        <div id="portal-wishlist-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                            <!-- Injected dynamically -->
                        </div>
                    </div>

                    <!-- Invoice Locker / Shopping Receipts History -->
                    <div class="glass-panel" style="padding: 24px;">
                        <h3 style="font-weight:600; font-size:1.1rem; margin-bottom:16px;">
                            <i class="fa-solid fa-receipt" style="margin-right: 8px; color: var(--accent-cyan);"></i>Shopping Invoice Locker
                        </h3>
                        <div class="table-responsive">
                            <table class="transactions-table">
                                <thead>
                                    <tr>
                                        <th>Checkout Date</th>
                                        <th>Total Purchase</th>
                                        <th>GST (18%)</th>
                                        <th>Invoice Receipt</th>
                                    </tr>
                                </thead>
                                <tbody id="portal-receipts-body">
                                    <!-- Injected dynamically -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="shared.js"></script>
    <script src="customer-portal.js"></script>
</body>
</html>
