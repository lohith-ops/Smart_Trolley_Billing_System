<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trolley - Customer Feedback</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <div style="font-weight: 600; font-size: 1.1rem; color: var(--text-primary);">
                    Customer Satisfaction Feedback
                </div>
                <div class="header-actions">
                    <button class="btn btn-outline" id="submit-feedback-btn">
                        <i class="fa-solid fa-star"></i> Submit New Feedback
                    </button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=10b981&color=fff" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Feedback Summary Stats -->
            <div class="overview-cards">
                <div class="card glass-panel gradient-border">
                    <div class="card-icon cyan"><i class="fa-solid fa-star-half-stroke"></i></div>
                    <div class="card-info">
                        <p>Average Satisfaction Rating</p>
                        <h3 id="stat-avg-rating">4.7 / 5.0</h3>
                    </div>
                </div>
                <div class="card glass-panel gradient-border">
                    <div class="card-icon green"><i class="fa-solid fa-comment-check"></i></div>
                    <div class="card-info">
                        <p>Total Feedback Forms Received</p>
                        <h3 id="stat-total-feedbacks">3</h3>
                    </div>
                </div>
            </div>

            <!-- Feedbacks logs -->
            <div class="glass-panel" style="padding: 24px; flex: 1;">
                <h3 style="font-weight:600; font-size:1.1rem; margin-bottom:20px;">Recent Reviews & Suggestions</h3>
                <div id="feedback-list-container" style="display: flex; flex-direction: column; gap: 16px;">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- Submit Feedback Modal -->
    <div class="modal-overlay" id="feedback-modal">
        <div class="modal-box glass-panel">
            <div class="modal-icon" style="color: #f59e0b;">
                <i class="fa-solid fa-circle-heart"></i>
            </div>
            <h2>Share Your Experience</h2>
            <p class="modal-sub">Tell us how to improve your supermarket checkout</p>
            
            <form id="feedback-form" class="register-form" style="margin-top: 16px;">
                <div class="form-group">
                    <label>Rate Your Experience (1 to 5 Stars)</label>
                    <div class="rating-stars" id="feedback-stars-input" style="margin-top: 8px;">
                        <i class="fa-solid fa-star active" data-rating="1"></i>
                        <i class="fa-solid fa-star active" data-rating="2"></i>
                        <i class="fa-solid fa-star active" data-rating="3"></i>
                        <i class="fa-solid fa-star active" data-rating="4"></i>
                        <i class="fa-solid fa-star active" data-rating="5"></i>
                    </div>
                    <input type="hidden" id="feedback-rating-val" value="5">
                </div>
                <div class="form-group">
                    <label>Comments & Suggestions</label>
                    <textarea id="feedback-comments" required placeholder="e.g. The checkout was instant! Saved a lot of queue time." class="form-input" style="height: 100px; resize: none; padding: 12px;"></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="feedback-cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-checkout" style="background: linear-gradient(135deg, #f59e0b, #d97706); border:none;">Submit Review</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="shared.js"></script>
    <script src="feedback.js"></script>
</body>
</html>
