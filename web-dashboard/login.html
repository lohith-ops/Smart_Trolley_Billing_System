<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Trolley Billing System</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Auth Scripts -->
    <script src="auth.js"></script>
</head>
<body class="dark-theme login-body">
    <div class="login-bg-glow">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
        <div class="glow-sphere sphere-3"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card glass-panel gradient-border">
            <div class="login-header">
                <div class="logo-icon-lg">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <h1 class="login-title">Smart Trolley System</h1>
                <p class="login-subtitle">Next-Gen IoT Automated Retail & Billing Platform</p>
            </div>

            <div id="login-error-alert" class="login-alert hidden">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="login-error-msg">Invalid username or password</span>
            </div>

            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-username"><i class="fa-solid fa-user"></i> Username</label>
                    <div class="input-with-icon">
                        <input type="text" id="login-username" name="username" placeholder="e.g. admin or cashier" required autocomplete="username" autofocus>
                        <i class="fa-solid fa-id-badge input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="input-with-icon">
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="toggle-password" class="password-toggle-btn" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="login-submit-btn" class="btn btn-primary login-btn">
                        <span>Sign In</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

                <div class="signup-prompt" style="margin-top: 14px; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
                    New customer? <a href="register.html" style="color: var(--accent-cyan); font-weight: 600; text-decoration: none; margin-left: 4px;">Create an Account <i class="fa-solid fa-arrow-right" style="font-size: 0.75rem;"></i></a>
                </div>
            </form>

            <div class="preset-section">
                <button type="button" id="toggle-demo-btn" class="demo-toggle-btn" style="background: rgba(255,255,255,0.04); border: 1px dashed var(--border-subtle); border-radius: 8px; width: 100%; padding: 8px 12px; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s;">
                    <span><i class="fa-solid fa-flask" style="color: var(--accent-cyan); margin-right: 6px;"></i> Evaluation & Demo Logins</span>
                    <i class="fa-solid fa-chevron-down" id="demo-chevron" style="transition: transform 0.3s;"></i>
                </button>
                <div id="demo-presets-container" class="preset-grid" style="display: none; margin-top: 12px;">
                    <button type="button" class="preset-btn" data-user="admin" data-pass="admin123" title="Full system administration & settings">
                        <i class="fa-solid fa-shield-halved" style="color: var(--accent-red);"></i>
                        <div class="preset-info">
                            <span class="preset-role">Admin</span>
                            <span class="preset-hint">admin / admin123</span>
                        </div>
                    </button>
                    <button type="button" class="preset-btn" data-user="manager" data-pass="manager123" title="Store reports, inventory & analytics">
                        <i class="fa-solid fa-chart-pie" style="color: var(--accent-purple);"></i>
                        <div class="preset-info">
                            <span class="preset-role">Manager</span>
                            <span class="preset-hint">manager / manager123</span>
                        </div>
                    </button>
                    <button type="button" class="preset-btn" data-user="cashier" data-pass="cashier123" title="Cart monitoring & checkout">
                        <i class="fa-solid fa-cash-register" style="color: var(--accent-green);"></i>
                        <div class="preset-info">
                            <span class="preset-role">Cashier</span>
                            <span class="preset-hint">cashier / cashier123</span>
                        </div>
                    </button>
                    <button type="button" class="preset-btn" data-user="customer" data-pass="customer123" title="Customer member portal & price finder">
                        <i class="fa-solid fa-user-tag" style="color: var(--accent-cyan);"></i>
                        <div class="preset-info">
                            <span class="preset-role">Customer</span>
                            <span class="preset-hint">customer / customer123</span>
                        </div>
                    </button>
                </div>
            </div>

            <div class="login-footer">
                <div class="system-status-chip">
                    <span class="pulse-dot"></span>
                    <span>IoT Gateway Connected</span>
                </div>
                <a href="customer-portal.html" class="guest-link">Continue as Guest <i class="fa-solid fa-chevron-right"></i></a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
