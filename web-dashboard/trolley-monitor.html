<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trolley - Trolley Monitor</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar (populated dynamically by shared.js) -->
        <aside class="sidebar glass-panel"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <span style="font-weight: 600; font-size: 1.1rem; color: var(--text-primary);">
                        Trolley Telemetry Monitor
                    </span>
                    <select id="monitor-trolley-select" class="form-input" style="width: 160px; margin: 0; padding: 6px 12px; font-size: 0.85rem;">
                        <!-- Options will be populated dynamically -->
                    </select>
                </div>
                <div class="header-actions">
                    <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=10b981&color=fff" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Monitor Grid Layout -->
            <div class="dashboard-grid" style="grid-template-rows: auto auto;">
                <!-- Left: Hardware Status and Customer Info -->
                <div style="display: flex; flex-direction: column; gap: 24px;">
                    <!-- Hardware Health -->
                    <div class="glass-panel" style="padding: 24px;">
                        <h3 style="font-weight:600; font-size:1.1rem; margin-bottom:16px;"><i class="fa-solid fa-microchip" style="margin-right: 8px; color: var(--accent-cyan);"></i>Hardware Health Telemetry</h3>
                        
                        <div style="display: flex; flex-direction: column; gap: 12px;" id="hw-telemetry-container">
                            <!-- Injected dynamically -->
                        </div>
                    </div>

                    <!-- Customer Info -->
                    <div class="glass-panel" style="padding: 24px;">
                        <h3 style="font-weight:600; font-size:1.1rem; margin-bottom:16px;"><i class="fa-solid fa-user-circle" style="margin-right: 8px; color: var(--accent-purple);"></i>Shopper Profile</h3>
                        <div id="customer-profile-card" style="display: flex; gap: 16px; align-items: center;">
                            <!-- Injected dynamically -->
                        </div>
                    </div>
                </div>

                <!-- Right: Active Bill Scans -->
                <div class="glass-panel" style="padding: 24px; display: flex; flex-direction: column;">
                    <div class="panel-header">
                        <h3>Active Cart Items</h3>
                        <div style="text-align: right;">
                            <span style="font-size: 0.85rem; color: var(--text-secondary); display: block;">Running Total</span>
                            <strong style="font-size: 1.8rem; color: var(--accent-green);" id="monitor-cart-total">Rs.0.00</strong>
                        </div>
                    </div>
                    
                    <div class="table-responsive" style="flex: 1; max-height: 400px; overflow-y: auto;">
                        <table class="transactions-table">
                            <thead>
                                <tr>
                                    <th>Product Name</th>
                                    <th>Unit Price</th>
                                    <th>Quantity</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="monitor-cart-items">
                                <!-- Injected dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Logic -->
    <script src="shared.js"></script>
    <script src="trolley-monitor.js"></script>
</body>
</html>
